title: "Developer Dashboard"
subtitle: "Split Fairly"

message:
  style: "is-info"
  title: "Welcome!"
  icon: "fa-solid fa-circle-info"
  content: "Split Fairly - splitting fairly made easy."

header: true
footer: '<p>Created with ☯️ by <a href="https://github.com/makomweb/">Martin Komischke</a></p>'

theme: default

services:
  - name: "Application"
    icon: "fa-solid fa-laptop-code"
    items:
      - name: "App"
        subtitle: "Symfony + MySQL"
        icon: "fa-solid fa-sign-in-alt"
        url: "http://localhost:8080/"
        target: "_blank"
      - name: "App (DEV)"
        subtitle: "React + Vite + HMR + Symfony + MySQL"
        icon: "fa-solid fa-tablet-screen-button"
        url: "http://localhost:5173"
        target: "_blank"
      - name: "User management"
        subtitle: "Admin login - EasyAdmin"
        icon: "fa-solid fa-users-cog"
        url: "http://localhost:8080/admin"
        target: "_blank"

  - name: "Persistence"
    icon: "fa-solid fa-database"
    items:
      - name: "Database administration"
        subtitle: "Adminer"
        icon: "fa-solid fa-gear"
        url: "http://localhost:8085/?server=db&username=root&db=app"
        target: "_blank"

  - name: "Resources"
    icon: "fas fa-credit-card-alt"
    items:
      - name: "Source code"
        subtitle: "Github"
        icon: "fa-brands fa-github"
        url: "https://github.com/makomweb/split-fairly"
        target: "_blank"
      - name: "Code coverage"
        subtitle: "PHPUnit coverage"
        icon: "fa-solid fa-clipboard-check"
        url: "http://localhost:8000/coverage/index.html"
        target: "_blank"
