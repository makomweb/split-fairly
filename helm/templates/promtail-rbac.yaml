{{- if .Values.logging.promtail.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "split-fairly.fullname" . }}-promtail
  labels:
    app.kubernetes.io/name: {{ include "split-fairly.name" . }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "split-fairly.fullname" . }}-promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "split-fairly.fullname" . }}-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "split-fairly.fullname" . }}-promtail
subjects:
  - kind: ServiceAccount
    name: {{ include "split-fairly.fullname" . }}-promtail
    namespace: {{ .Release.Namespace }}
{{- end }}
