apiVersion: v1
kind: Service
metadata:
  name: {{ include "split-fairly.fullname" . }}-app
spec:
  type: ClusterIP
  selector:
    app: {{ include "split-fairly.fullname" . }}-app
  ports:
    - port: {{ .Values.service.app.port }}
      targetPort: {{ .Values.service.app.port }}
      protocol: TCP
      name: http
